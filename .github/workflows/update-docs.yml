name: Update Documentation

on:
  workflow_dispatch:
  repository_dispatch:
    types: [xdk-released]
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Docs Repository
        uses: actions/checkout@v4

      - name: Checkout XDK Generator
        uses: actions/checkout@v4
        with:
          repository: xdevplatform/xdk
          ref: main
          path: .xdk-gen

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache XDK Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .xdk-gen

      - name: Fetch Latest OpenAPI Specification
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 120 \
            -o openapi.json \
            https://api.x.com/2/openapi.json
          jq -e .openapi openapi.json > /dev/null

      # The API returns OAuth2 scopes in a different order on every request.
      - name: Normalize OpenAPI Scope Order
        run: node .github/scripts/sync-openapi-mdx.mjs --normalize

      - name: Sync XDK Reference, OpenAPI Code Samples Overlay, and Endpoint Stubs
        run: |
          cargo run --manifest-path .xdk-gen/Cargo.toml --bin xdk-build -- \
            docs --spec ./openapi.json --output . --sync-endpoint-stubs
          rm -rf .xdk-gen

      # Repoints nav-linked pages whose operation was renamed in the spec, and
      # fails when a nav-linked page still points at a missing operation.
      - name: Reconcile and Validate Endpoint Pages Against the OpenAPI Spec
        run: node .github/scripts/sync-openapi-mdx.mjs --reconcile --validate

      - name: Validate Mintlify Build & XDK Docs
        run: |
          npx --yes mint@latest validate --no-build --files "xdks/**" "tools/**" "tools-and-libraries.mdx"
          npx --yes mint@latest validate --no-build --disable unknown-component
          npx --yes mint@latest broken-links --files "xdks/**" "tools/**" "tools-and-libraries.mdx"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add openapi.json overlays/xdk-code-samples.json docs.json xdks tools tools-and-libraries.mdx x-api
          # Endpoint pages the reconcile step repointed outside the paths above.
          git add --update -- '*.mdx'
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "chore: sync OpenAPI spec, XDK reference, and code samples overlay"
            git push
          fi
