name: Validate Docs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Mintlify Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Endpoint Pages Against the OpenAPI Spec
        run: |
          node --test .github/scripts/sync-openapi-mdx.test.mjs
          node .github/scripts/sync-openapi-mdx.mjs --validate

      - name: Validate XDK & Tools Pages
        run: npx --yes mint@latest validate --no-build --files "xdks/**" "tools/**" "tools-and-libraries.mdx"

      - name: Validate OpenAPI Spec, Overlay, and Navigation
        run: npx --yes mint@latest validate --no-build --disable unknown-component

      - name: Check XDK & Tools Internal Links
        run: npx --yes mint@latest broken-links --files "xdks/**" "tools/**" "tools-and-libraries.mdx"
